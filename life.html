<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life | Sumanpa Academy</title>
  <meta name="description" content="Articles on fitness, food and personal growth from Sumanpa Academy." />
  <meta name="theme-color" content="#1f5c3a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Nunito Sans is a backup for devices without Avenir -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #1f5c3a; --green-deep: #153f28; --green-light: #2c7a4f;
      --gold: #c9a14a; --gold-dark: #a9842f;
      --brown: #2a1c12; --brown-line: #4a3526;
      --black: #0d0b09; --white: #ffffff; --muted: #d9cfc4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--black); color: var(--white); font-family: "Avenir", "Avenir Next", "Nunito Sans", "Segoe UI", sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    img { max-width: 100%; display: block; }
    .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 22px; }
    .kente { height: 10px; background: repeating-linear-gradient(90deg, var(--gold) 0 40px, var(--black) 40px 52px, var(--green-light) 52px 92px, var(--black) 92px 104px, var(--gold) 104px 120px, var(--brown) 120px 160px); }

    header.nav { position: sticky; top: 0; z-index: 50; background: rgba(13,11,9,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(201,161,74,.18); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 66px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--green); border: 1px solid var(--gold); display: grid; place-items: center; }
    .brand-mark img { width: 20px; height: 30px; object-fit: contain; }
    .brand-name { font-weight: 900; font-size: 17px; }
    .brand-name span { color: var(--gold); }
    .back { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 15px; }
    .back:hover { color: var(--gold); }

    .hero { padding: 72px 0 40px; background: radial-gradient(circle at 85% 0%, rgba(201,161,74,.14), transparent 45%), linear-gradient(160deg, var(--green-deep), var(--black) 75%); }
    .eyebrow { color: var(--gold); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: 12px; margin: 0 0 10px; }
    h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.05; margin: 0 0 14px; font-weight: 900; }
    .lead { color: var(--muted); font-size: 18px; max-width: 620px; margin: 0; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 36px 0 28px; }
    .chip { border: 2px solid rgba(255,255,255,.22); background: transparent; color: var(--white); font: inherit; font-weight: 800; font-size: 14px; padding: 9px 18px; border-radius: 999px; cursor: pointer; min-height: 44px; }
    .chip:hover { border-color: var(--gold); color: var(--gold); }
    .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--black); }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; padding-bottom: 80px; }
    .card { display: flex; flex-direction: column; background: var(--brown); border: 1px solid var(--brown-line); border-radius: 18px; overflow: hidden; text-decoration: none; transition: transform .2s, border-color .2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--gold); }
    .card img { aspect-ratio: 16 / 10; width: 100%; object-fit: cover; }
    .card-body { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: rgba(201,161,74,.14); padding: 4px 10px; border-radius: 999px; }
    .card h2 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 900; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; }
    .meta { margin-top: auto; color: var(--muted); font-size: 13px; font-weight: 600; }
    .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }

    footer { padding: 34px 0; border-top: 1px solid var(--brown-line); color: var(--muted); font-size: 14px; }
    footer a { color: var(--gold); font-weight: 800; text-decoration: none; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .hero { padding: 52px 0 28px; } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="brand" aria-label="Sumanpa Academy home">
        <div class="brand-mark"><img src="/logo-mask.png" alt="" /></div>
        <div class="brand-name">Sumanpa <span>Academy</span></div>
      </a>
      <a href="/" class="back">&larr; Home</a>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">01 · Life</p>
      <h1>Life</h1>
      <p class="lead">Family, faith, health, growth and finding your way, at home or abroad.</p>
    </div>
  </section>
  <div class="kente" aria-hidden="true"></div>

  <main class="wrap">
    <div class="filters" role="group" aria-label="Filter articles by topic">
      <button class="chip" data-tag="all" aria-pressed="true">All</button>
      <button class="chip" data-tag="fitness" aria-pressed="false">Fitness</button>
      <button class="chip" data-tag="food" aria-pressed="false">Food</button>
      <button class="chip" data-tag="personal-growth" aria-pressed="false">Personal growth</button>
    </div>
    <div class="grid" id="articles"></div>
  </main>

  <footer>
    <div class="wrap">Questions? Message us on Instagram <a href="https://www.instagram.com/sumanpaacademy" target="_blank" rel="noopener">@sumanpaacademy</a></div>
  </footer>

  <script>
    // ---- ARTICLES: add new ones at the TOP of this list (newest first) ----
    // tags: "fitness", "food", "personal-growth"
    const ARTICLES = [
      {
        title: "The Hard Part Is Not Starting: Five Tips for Staying Consistent",
        url: "/life/staying-consistent",
        date: "November 2026",
        tags: ["fitness"],
        excerpt: "More than ten years of training four to five times a week taught us the answer is not more willpower. It is a system, a reason, and a bit of grace.",
        cover: "/images/life-consistency-cover.jpg"
      }
    ];

    const TAG_NAMES = { "fitness": "Fitness", "food": "Food", "personal-growth": "Personal growth" };
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const grid = document.getElementById("articles");

    function render(tag) {
      const list = tag === "all" ? ARTICLES : ARTICLES.filter(a => a.tags.includes(tag));
      grid.innerHTML = list.length ? list.map(a => `
        <a class="card" href="${a.url}">
          <img src="${a.cover}" alt="" loading="lazy" />
          <div class="card-body">
            <div class="tags">${a.tags.map(t => `<span class="tag">${esc(TAG_NAMES[t] || t)}</span>`).join("")}</div>
            <h2>${esc(a.title)}</h2>
            <p>${esc(a.excerpt)}</p>
            <div class="meta">${esc(a.date)}</div>
          </div>
        </a>`).join("")
        : `<p class="empty">No ${esc(TAG_NAMES[tag] || tag).toLowerCase()} articles yet. Check back soon.</p>`;
    }

    document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip ? "true" : "false"));
      render(chip.dataset.tag);
      try { history.replaceState(null, "", chip.dataset.tag === "all" ? location.pathname : "#" + chip.dataset.tag); } catch (e) {}
    }));

    const start = location.hash.slice(1);
    const startChip = document.querySelector(`.chip[data-tag="${start}"]`);
    if (startChip) startChip.click(); else render("all");
  </script>
</body>
</html>
